<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>借笔 · 文案风格生成器</title>
<style>
  /* ========== 釉面与色卡：借笔 ========== */
  :root {
    --bg: #F3F0EA;          /* 坯体暖灰 */
    --bg-card: #FBF9F5;     /* 米白釉面 */
    --line: #E1DCD2;        /* 砖缝线 */
    --ink: #2B2B28;         /* 墨灰文字 */
    --ink-soft: #6E6A61;    /* 次级文字 */
    --glaze: #1F6E68;       /* 釉青主色 */
    --glaze-deep: #175852;  /* 深釉 */
    --glaze-soft: #DCEDE9;  /* 釉青浅底 */
    --warn: #B4552D;        /* 陶土橙（小面积警示） */
    --shadow: 0 1px 2px rgba(43,43,40,.05), 0 4px 16px rgba(43,43,40,.06);
    --radius: 10px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--bg);
    line-height: 1.6;
    min-height: 100vh;
  }

  /* 背景：淡砖缝网格 */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 44px 44px;
    opacity: .45;
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 48px 20px 72px;
  }

  /* ---------- 头部 ---------- */
  header { margin-bottom: 32px; }
  .eyebrow {
    display: flex; align-items: center; gap: 10px;
    font-size: 12px; letter-spacing: .18em;
    color: var(--ink-soft); margin-bottom: 12px;
  }
  .eyebrow::before {
    content: ""; width: 14px; height: 14px;
    background: linear-gradient(135deg, var(--glaze) 50%, var(--glaze-deep) 50%);
    border-radius: 2px; transform: rotate(45deg);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 32px; font-weight: 800; letter-spacing: .02em;
  }
  .sub { margin: 0; color: var(--ink-soft); font-size: 14px; }

  /* ---------- 步骤面板 ---------- */
  .panel {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 24px 24px;
    margin-bottom: 20px;
  }

  /* 可折叠面板：内边距移到面板头 + 面板体，整体可点 */
  .panel.collapsible { padding: 0; overflow: hidden; }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 16px 22px 14px;
    cursor: pointer; user-select: none;
    transition: background .2s;
  }
  .panel-head:hover { background: var(--glaze-soft); }
  .panel-head:focus-visible { outline: 2px solid var(--glaze); outline-offset: -2px; }
  .panel-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .panel-status {
    font-size: 12.5px; color: var(--ink-soft);
    background: var(--bg); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 12px;
    white-space: nowrap;
  }
  .panel-status.ok {
    color: var(--glaze-deep); border-color: var(--glaze-soft); background: var(--glaze-soft);
  }
  .chevron {
    font-size: 18px; color: var(--ink-soft); line-height: 1;
    transition: transform .25s ease;
  }
  .panel.open .chevron { transform: rotate(180deg); }
  .panel-body { display: none; }
  .panel.open .panel-body { display: block; animation: panel-open .22s ease; }
  @keyframes panel-open {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: none; }
  }
  .panel-inner { padding: 0 22px 22px; }

  .step-head {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 14px;
  }
  .step-no {
    font-size: 13px; font-weight: 700;
    color: var(--bg-card);
    background: var(--glaze);
    border-radius: 4px;
    padding: 1px 8px;
    letter-spacing: .06em;
  }
  .step-title { font-size: 17px; font-weight: 700; margin: 0; }
  .step-hint { margin-left: auto; font-size: 12px; color: var(--ink-soft); }

  /* ---------- 上传按钮（替代原大拖拽区） ---------- */
  .btn-upload {
    width: 100%;
    border: 1.5px dashed var(--glaze);
    background: var(--glaze-soft);
    color: var(--glaze-deep);
    padding: 14px 20px;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s, border-color .2s, color .2s;
  }
  .btn-upload .plus { font-size: 18px; font-weight: 700; line-height: 1; }
  .btn-upload:hover { background: #CEE4DF; }
  .btn-upload.drag { background: var(--glaze); border-color: var(--glaze); color: #fff; }
  .upload-tip { text-align: center; font-size: 12px; color: var(--ink-soft); margin: 8px 0 16px; }

  /* 样本参考文档卡片 */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-top: 16px; }
  .tile {
    position: relative; /* 让 .remove 按钮能锚定在卡片内 */
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    background: var(--bg-card);
    cursor: pointer;
    transition: box-shadow .15s, transform .15s;
  }
  .tile:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
  .tile .swatch {
    height: 10px; border-radius: 3px; margin-bottom: 8px;
  }
  .tile .fname {
    font-size: 12.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile .fmeta { font-size: 11px; color: var(--ink-soft); }
  .tile .remove {
    position: absolute; top: 6px; right: 8px;
    border: 1px solid rgba(180,85,45,.35);
    background: rgba(180,85,45,.10);
    cursor: pointer;
    color: var(--warn); font-size: 14px; font-weight: 700; line-height: 1;
    padding: 1px 6px 2px; border-radius: 6px;
    opacity: .85; transition: opacity .15s, background .15s, color .15s;
  }
  .tile:hover .remove { opacity: 1; }
  .tile .remove:hover { color: #fff; background: var(--warn); border-color: var(--warn); opacity: 1; }

  /* 样本预览 */
  .preview {
    margin-top: 10px; padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
    font-size: 13px; white-space: pre-wrap;
    max-height: 220px; overflow: auto;
    display: none;
  }
  .preview.show { display: block; }

  .empty-tip { font-size: 13px; color: var(--ink-soft); margin-top: 12px; }

  /* 已移除（归档）样本区 */
  .archived-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--ink-soft); margin-bottom: 6px;
  }
  .archived-item {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px dashed var(--line); border-radius: 6px;
    padding: 6px 10px; margin-bottom: 6px; font-size: 12px;
  }
  .archived-item .fname { max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .archived-item button {
    border: 1px solid var(--line); background: none; border-radius: 5px;
    font-size: 12px; color: var(--ink); cursor: pointer; padding: 2px 8px;
  }
  .archived-item button:hover { border-color: var(--ink-soft); }

  /* ---------- 按钮 ---------- */
  .btn {
    appearance: none; border: none; cursor: pointer;
    font-family: inherit; font-size: 14px; font-weight: 600;
    border-radius: 8px;
    padding: 10px 20px;
    transition: background .2s, transform .1s, box-shadow .2s;
    outline-offset: 2px;
  }
  .btn:focus-visible { outline: 2px solid var(--glaze); }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  .btn-primary {
    color: #fff;
    background: linear-gradient(120deg, var(--glaze), var(--glaze-deep));
    position: relative; overflow: hidden;
  }
  /* 釉面流光：hover 时一道光泽扫过 */
  .btn-primary::after {
    content: "";
    position: absolute; top: 0; left: -80%; width: 60%; height: 100%;
    background: linear-gradient(105deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-20deg);
    transition: left .55s ease;
  }
  .btn-primary:hover:not(:disabled)::after { left: 120%; }
  .btn-primary:hover:not(:disabled) { box-shadow: 0 4px 14px rgba(31,110,104,.3); }

  .btn-ghost {
    background: transparent; color: var(--glaze-deep);
    border: 1.5px solid var(--glaze);
  }
  .btn-ghost:hover:not(:disabled) { background: var(--glaze-soft); }

  .btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

  /* ---------- 风格模式切换 ---------- */
  .mode-row { margin-top: 4px; align-items: center; }
  .mode-label {
    font-size: 13px; color: var(--ink-soft); font-weight: 600; margin-right: 2px;
  }
  .mode-btn { padding: 6px 14px; font-size: 13px; border-radius: 999px; font-weight: 500; }
  .mode-btn.mode-active {
    background: var(--glaze); color: #fff; border-color: var(--glaze);
  }

  /* ---------- 行业输入区 ---------- */
  .industry-row { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; }
  .industry-row .topic-input { flex: 1; padding: 7px 12px; font-size: 13px; }

  /* ---------- 主题输入区 ---------- */
  .topic-box { margin: 2px 0 14px; display: flex; flex-direction: column; gap: 8px; }
  .topic-row { display: flex; gap: 10px; }
  .topic-input {
    flex: 1; font-family: inherit; font-size: 14px; color: var(--ink);
    background: #fff; border: 1.5px solid var(--glaze-soft);
    border-radius: 8px; padding: 9px 12px; outline-offset: 2px;
  }
  .topic-input:focus { border-color: var(--glaze); }
  .topic-area {
    font-family: inherit; font-size: 14px; color: var(--ink); line-height: 1.6;
    background: var(--glaze-soft); border: 1.5px dashed var(--glaze);
    border-radius: 8px; padding: 10px 12px; resize: vertical;
    width: 100%; box-sizing: border-box; outline-offset: 2px;
  }
  .topic-area:focus { border-color: var(--glaze); border-style: solid; }

  /* ---------- 画像摘要（详情默认收起，展开查看） ---------- */
  .style-details {
    margin-top: 14px;
    border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg);
  }
  .style-details summary {
    cursor: pointer; list-style: none; user-select: none;
    padding: 10px 14px;
    font-size: 13px; font-weight: 600; color: var(--glaze-deep);
    display: flex; align-items: center; gap: 8px;
  }
  .style-details summary::-webkit-details-marker { display: none; }
  .style-details summary::before { content: '▸'; color: var(--ink-soft); transition: transform .2s; }
  .style-details[open] summary::before { transform: rotate(90deg); }
  .details-body { padding: 2px 14px 14px; }
  .style-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .style-cell {
    background: var(--bg-card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12.5px;
  }
  .style-cell .k { font-weight: 700; color: var(--glaze-deep); margin-bottom: 2px; }
  .style-cell .v { color: var(--ink); white-space: pre-wrap; word-break: break-word; }
  .style-meta { font-size: 11.5px; color: var(--ink-soft); margin-top: 10px; }

  /* ---------- 输出区 ---------- */
  .output {
    margin-top: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--bg);
    padding: 16px 18px;
    min-height: 120px;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
  }
  .output.show { display: block; }
  .output .type-tag {
    display: inline-block; font-size: 11px; font-weight: 700;
    color: var(--glaze-deep); background: var(--glaze-soft);
    border-radius: 4px; padding: 1px 8px; margin-bottom: 8px;
    letter-spacing: .05em;
  }
  .output .body { line-height: 1.75; }
  .caret { display: inline-block; width: 2px; height: 1em; background: var(--glaze); vertical-align: -2px; margin-left: 1px; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .output.error { border-color: var(--warn); color: #8A3D1E; }

  .foot { margin-top: 28px; text-align: center; }
  .link-reset {
    border: none; background: none; cursor: pointer;
    color: var(--ink-soft); font-size: 12px; text-decoration: underline;
    font-family: inherit;
  }
  .link-reset:hover { color: var(--warn); }

  /* ---------- 响应与可访问性 ---------- */
  @media (max-width: 600px) {
    .wrap { padding: 28px 14px 48px; }
    h1 { font-size: 26px; }
    .panel-head { padding: 14px 16px 12px; }
    .panel-inner { padding: 0 16px 16px; }
    .panel-status { max-width: 42vw; overflow: hidden; text-overflow: ellipsis; }
    .style-grid { grid-template-columns: 1fr; }
    .step-hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-primary::after { transition: none; left: 0; display: none; }
    .caret { animation: none; }
    .tile { transition: none; }
    .panel.open .panel-body { animation: none; }
    .chevron { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">BORROWED&nbsp;PEN</div>
    <h1>借笔</h1>
    <p class="sub">上传你喜欢的文案，借它的笔，写你想说的话。</p>
  </header>

  <!-- 步骤 1：参考文档（可折叠，列表保留「点击看内容」） -->
  <section class="panel collapsible" id="panelSamples">
    <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
      <span class="step-no">1</span>
      <h2 class="step-title">参考文档</h2>
      <span class="panel-right">
        <span class="panel-status" id="samplesStatus"></span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </span>
    </div>
    <div class="panel-body">
      <div class="panel-inner">
        <button type="button" class="btn btn-upload" id="uploadBtn" aria-label="选择参考文档文件">
          <span class="plus">＋</span>上传参考文档（.txt / .md）
        </button>
        <p class="upload-tip">点击选择文件，或将文件直接拖到按钮上 · 可多选</p>
        <input type="file" id="fileInput" multiple accept=".txt,.md" style="display:none">
        <div class="tiles" id="tiles"></div>
        <div class="preview" id="preview"></div>
        <p class="empty-tip" id="sampleEmpty">还没有参考文档，先点上方按钮上传几篇文案。</p>
        <div class="archived" id="archivedArea" style="display:none; margin-top:14px;">
          <div class="archived-head">
            <span>已移除（归档）· 文件保留，不再参与生成</span>
            <span id="archivedCount"></span>
          </div>
          <div id="archivedList"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 步骤 2：风格画像（可折叠，详情默认收起） -->
  <section class="panel collapsible" id="panelStyle">
    <div class="panel-head" role="button" tabindex="0" aria-expanded="true">
      <span class="step-no">2</span>
      <h2 class="step-title">风格画像</h2>
      <span class="panel-right">
        <span class="panel-status" id="styleStatus"></span>
        <span class="chevron" aria-hidden="true">⌄</span>
      </span>
    </div>
    <div class="panel-body">
      <div class="panel-inner">
        <div class="industry-row">
          <label class="mode-label" for="industryInput">行业（选填，用于生成角色身份）</label>
          <input id="industryInput" class="topic-input" maxlength="20">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="buildBtn">生成画像</button>
        </div>
        <div id="styleArea"></div>
      </div>
    </div>
  </section>

  <!-- 步骤 3：生成文案（常开，核心操作） -->
  <section class="panel">
    <div class="step-head">
      <span class="step-no">3</span>
      <h2 class="step-title">生成文案</h2>
      <span class="step-hint" id="genHint">点击一种类型，流式输出</span>
    </div>
    <div class="topic-box">
      <label class="mode-label" for="topicInput">今天干了什么（选填，不填则随机场景）</label>
      <div class="topic-row">
        <input id="topicInput" class="topic-input" maxlength="100">
        <button class="btn btn-ghost" id="topicBtn">生成主题</button>
      </div>
      <textarea id="topicArea" class="topic-area" rows="2"></textarea>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" data-type="xiaohongshu">小红书种草</button>
      <button class="btn btn-primary" data-type="wechat_moment">朋友圈短文案</button>
      <button class="btn btn-primary" data-type="sales_script">销售话术</button>
    </div>
    <div class="btn-row mode-row">
      <span class="mode-label">风格模式</span>
      <button class="btn btn-ghost mode-btn mode-active" data-mode="style">风格画像·推荐</button>
      <button class="btn btn-ghost mode-btn" data-mode="none">仅示例</button>
    </div>
    <div class="output" id="output"></div>
  </section>

  <div class="foot">
    <button class="link-reset" id="resetBtn">清空样本与画像</button>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const uploadBtn = $('uploadBtn'), fileInput = $('fileInput'), tiles = $('tiles'),
        preview = $('preview'), sampleEmpty = $('sampleEmpty'),
        buildBtn = $('buildBtn'), styleArea = $('styleArea'),
        output = $('output'), genHint = $('genHint'), resetBtn = $('resetBtn');

  // 样本瓷片用的一组釉色（按文件名取色）
  const SWATCHES = ['#1F6E68','#B4552D','#6B7A52','#4A6375','#9A6B4F','#5D5A78','#8A5630','#3D6B61'];
  const hash = (s) => [...s].reduce((a, c) => (a * 31 + c.codePointAt(0)) % 997, 7);
  const fmtSize = (n) => n > 1024 ? (n/1024).toFixed(1) + ' KB' : n + ' B';

  let state = { sample_count: 0, style_built: false, style: null, samples: [] };

  /* ---------- 可折叠面板 ---------- */
  function setPanelOpen(panel, open) {
    panel.classList.toggle('open', open);
    panel.querySelector('.panel-head').setAttribute('aria-expanded', open);
  }
  document.querySelectorAll('.panel.collapsible .panel-head').forEach(head => {
    head.addEventListener('click', () => {
      const panel = head.closest('.panel');
      setPanelOpen(panel, !panel.classList.contains('open'));
    });
    head.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); head.click(); }
    });
  });

  // 首次加载后按内容设置默认开合：参考文档展开（列表可见）；画像有则收起、无则展开引导生成
  let inited = false;
  function initOpen() {
    if (inited) return;
    inited = true;
    setPanelOpen($('panelSamples'), true);
    setPanelOpen($('panelStyle'), !state.style_built);
  }

  // 面板头状态摘要（折叠时也能看到）
  function updatePanelStatus() {
    const st = $('samplesStatus');
    st.textContent = state.samples.length ? `已上传 ${state.samples.length} 篇` : '还没有参考文档';
    st.classList.toggle('ok', state.samples.length > 0);
    const st2 = $('styleStatus');
    if (state.style_built) {
      st2.textContent = `已就绪 · 基于 ${state.style?.sample_count ?? '?'} 篇`;
      st2.classList.add('ok');
    } else {
      st2.textContent = '未生成画像';
      st2.classList.remove('ok');
    }
  }

  /* ---------- 状态 ---------- */
  async function refresh() {
    const res = await fetch('/api/status');
    state = await res.json();
    renderSamples(); renderStyle(); renderArchived();
    buildBtn.disabled = state.sample_count === 0;
    genHint.textContent = state.style_built ? '画像就绪，点击生成' : '请先完成步骤 1 和 2';
    updatePanelStatus();
    initOpen();
  }

  /* ---------- 样本渲染 ---------- */
  function renderSamples() {
    tiles.innerHTML = '';
    sampleEmpty.style.display = state.samples.length ? 'none' : 'block';
    state.samples.forEach(s => {
      const el = document.createElement('div');
      el.className = 'tile';
      el.title = '点击查看内容';
      el.innerHTML = `
        <button class="remove" title="移出此参考文档（文件保留，可恢复）">×</button>
        <div class="swatch" style="background:${SWATCHES[hash(s.name) % SWATCHES.length]}"></div>
        <div class="fname">${escapeHtml(s.name)}</div>
        <div class="fmeta">${fmtSize(s.size)} · ${s.mtime}</div>`;
      el.addEventListener('click', () => togglePreview(s.name));
      el.querySelector('.remove').addEventListener('click', (ev) => deleteSample(s.name, ev));
      tiles.appendChild(el);
    });
  }

  async function deleteSample(name, ev) {
    ev.stopPropagation();
    if (!confirm(`确定将「${name}」移出吗？\n它不再参与画像生成和示例抽取，文件会保留在归档区，可随时恢复。`)) return;
    const res = await fetch('/api/sample?name=' + encodeURIComponent(name), { method: 'DELETE' }).then(r => r.json());
    if (res.ok) {
      preview.classList.remove('show');
      refresh();
      alert(res.message + (res.total > 0 ? '；画像基于旧样本，需要时请重新生成' : ''));
    } else {
      alert(res.message || '移除失败');
    }
  }

  /* ---------- 已移除（归档）样本 ---------- */
  function renderArchived() {
    const area = document.getElementById('archivedArea');
    const list = document.getElementById('archivedList');
    const cnt = document.getElementById('archivedCount');
    const items = state.archived || [];
    if (!items.length) { area.style.display = 'none'; return; }
    area.style.display = 'block';
    cnt.textContent = items.length + ' 个';
    list.innerHTML = '';
    items.forEach(it => {
      const row = document.createElement('div');
      row.className = 'archived-item';
      row.innerHTML = `<span class="fname" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}</span>
        <button type="button">恢复</button>`;
      row.querySelector('button').addEventListener('click', () => restoreSample(it.name));
      list.appendChild(row);
    });
  }

  async function restoreSample(name) {
    if (!confirm(`确定恢复「${name}」吗？恢复后它重新参与画像生成和示例抽取。`)) return;
    const res = await fetch('/api/restore', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    }).then(r => r.json());
    if (res.ok) {
      refresh();
      alert(res.message);
    } else {
      alert(res.message || '恢复失败');
    }
  }

  async function togglePreview(name) {
    if (preview.style.display === 'block' && preview.dataset.name === name) {
      preview.classList.remove('show'); return;
    }
    const res = await fetch('/api/sample?name=' + encodeURIComponent(name));
    const data = await res.json();
    if (data.ok) {
      preview.dataset.name = name;
      preview.textContent = data.content;
      preview.classList.add('show');
    }
  }

  /* ---------- 画像渲染（详情可折叠，默认收起） ---------- */
  const STYLE_LABELS = {
    structure:'结构骨架', openings:'开头句库', core_templates:'观念主体', closings:'收尾句库',
    imagery:'意象', tone_anchors:'语气锚点', humor:'幽默套路', length:'篇幅', avoid:'要避免的'
  };
  // 画像字段格式化：数组（句库/意象/锚点）换行展示，length 对象拼成"min-median-max 字"
  function fmtStyleValue(k, v) {
    if (k === 'length' && v && typeof v === 'object') return `${v.min}-${v.median}-${v.max} 字`;
    if (Array.isArray(v)) {
      return v
        .filter(Boolean)
        .map(it => {
          if (typeof it === 'string') return it;                                  // 字符串数组：语气锚点
          if (it.domain)                                                          // 意象 {domain, examples}
            return it.examples && it.examples.length ? `${it.domain}：${it.examples.join('、')}` : it.domain;
          if (it.pattern || it.example)                                           // 句库/幽默 {pattern, example}
            return (it.pattern || '') + (it.pattern && it.example ? ' 例：' : '') + (it.example || '');
          return '';
        })
        .filter(Boolean)
        .join('\n');
    }
    return v;
  }
  function renderStyle() {
    styleArea.innerHTML = '';
    if (!state.style) {
      styleArea.innerHTML = `<p class="empty-tip">画像未生成。上传样本后点击「生成画像」，AI 会提炼这套文案的风格。</p>`;
      return;
    }
    const s = state.style;
    const det = document.createElement('details');
    det.className = 'style-details';
    const sum = document.createElement('summary');
    sum.textContent = '展开查看画像详情';
    const body = document.createElement('div');
    body.className = 'details-body';
    const grid = document.createElement('div');
    grid.className = 'style-grid';
    Object.entries(STYLE_LABELS).forEach(([k, label]) => {
      // structure 字段附带它的原句例一起展示
      const v = k === 'structure' && s.structure_example
        ? s[k] + '\n（原句例：' + s.structure_example + '）'
        : s[k];
      if (v === undefined || v === null || v === '') return;
      if (typeof v === 'string' && v === '（未提炼）') return;
      if (Array.isArray(v) && !v.length) return;
      const cell = document.createElement('div');
      cell.className = 'style-cell';
      cell.innerHTML = `<div class="k">${label}</div><div class="v">${escapeHtml(fmtStyleValue(k, v))}</div>`;
      grid.appendChild(cell);
    });
    body.appendChild(grid);
    const meta = document.createElement('div');
    meta.className = 'style-meta';
    meta.textContent = `基于 ${s.sample_count ?? '?'} 篇样本 · ${s.source_files?.join('、') ?? ''} · ${s.built_at ?? ''}`;
    body.appendChild(meta);
    det.appendChild(sum);
    det.appendChild(body);
    styleArea.appendChild(det);
  }

  /* ---------- 上传 ---------- */
  function uploadFiles(fileList) {
    if (!fileList.length) return;
    const fd = new FormData();
    [...fileList].forEach(f => fd.append('files', f));
    uploadBtn.innerHTML = '上传中…';
    fetch('/api/upload', { method: 'POST', body: fd })
      .then(r => r.json())
      .then(d => { alert(d.message); refresh(); })
      .catch(e => alert('上传失败：' + e.message))
      .finally(() => { uploadBtn.innerHTML = '<span class="plus">＋</span>上传参考文档（.txt / .md）'; fileInput.value = ''; });
  }

  uploadBtn.addEventListener('click', () => fileInput.click());
  uploadBtn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  ['dragover','dragenter'].forEach(ev => uploadBtn.addEventListener(ev, e => { e.preventDefault(); uploadBtn.classList.add('drag'); }));
  ['dragleave','drop'].forEach(ev => uploadBtn.addEventListener(ev, e => { e.preventDefault(); uploadBtn.classList.remove('drag'); }));
  uploadBtn.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));
  fileInput.addEventListener('change', () => uploadFiles(fileInput.files));

  /* ---------- 生成画像 ---------- */
  buildBtn.addEventListener('click', async () => {
    buildBtn.disabled = true;
    buildBtn.textContent = '画像生成中…';
    try {
      const res = await fetch('/api/build_style', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ industry: $('industryInput').value.trim() })
      });
      const d = await res.json();
      if (d.ok) { state.style = d.style; state.style_built = true; renderStyle(); }
      else alert('生成失败：' + d.message);
    } catch (e) { alert('生成失败：' + e.message); }
    finally { buildBtn.disabled = state.sample_count === 0; buildBtn.textContent = '生成画像'; refresh(); }
  });

  /* ---------- 主题层：今天干了什么 → 主题 ---------- */
  const topicInput = $('topicInput'), topicBtn = $('topicBtn'), topicArea = $('topicArea');
  topicBtn.addEventListener('click', async () => {
    const text = topicInput.value.trim();
    if (!text) { alert('先输入今天干了什么'); return; }
    topicBtn.disabled = true;
    topicBtn.textContent = '主题生成中…';
    try {
      const res = await fetch('/api/build_topic', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text })
      });
      const d = await res.json();
      if (d.ok) topicArea.value = d.topic;
      else alert('主题生成失败：' + d.message);
    } catch (e) {
      alert('主题生成失败：' + e.message);
    }
    topicBtn.disabled = false;
    topicBtn.textContent = '生成主题';
  });

  /* ---------- 风格模式切换 ---------- */
  let styleMode = 'style';
  const modeBtns = [...document.querySelectorAll('.mode-btn')];
  modeBtns.forEach(m => m.addEventListener('click', () => {
    styleMode = m.dataset.mode;
    modeBtns.forEach(x => x.classList.toggle('mode-active', x === m));
  }));

  /* ---------- 生成文案（SSE 流式） ---------- */
  const genBtns = [...document.querySelectorAll('[data-type]')];
  let streaming = false;

  function showOutput() {
    output.classList.add('show');
    output.classList.remove('error');
    output.innerHTML = '';
  }
  function appendCaret() {
    const c = document.createElement('span');
    c.className = 'caret';
    output.appendChild(c);
    return c;
  }

  genBtns.forEach(btn => {
    btn.addEventListener('click', async () => {
      if (streaming) return;
      streaming = true;
      genBtns.forEach(b => b.disabled = true);
      modeBtns.forEach(b => b.disabled = true);
      topicBtn.disabled = true;
      const type = btn.dataset.type;
      const tag = document.createElement('div');
      tag.className = 'type-tag';
      tag.textContent = btn.textContent;
      showOutput();
      output.appendChild(tag);
      const body = document.createElement('div');
      body.className = 'body';
      output.appendChild(body);
      const caret = appendCaret();

      try {
        const payload = { type, style_mode: styleMode };
        const topic = topicArea.value.trim();
        if (topic) payload.topic = topic;
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok || !res.body) throw new Error('请求失败 ' + res.status);

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const frames = buf.split('\n\n');
          buf = frames.pop();
          for (const frame of frames) {
            const line = frame.trim().replace(/^data:\s*/, '');
            if (!line) continue;
            const ev = JSON.parse(line);
            if (ev.type === 'delta') {
              body.textContent += ev.content;
              body.scrollTop = 0;
              output.scrollIntoView({ block: 'nearest' });
            } else if (ev.type === 'done') {
              caret.remove();
            } else if (ev.type === 'error') {
              output.classList.add('error');
              body.textContent = '生成失败：' + ev.message;
              caret.remove();
            }
          }
        }
      } catch (e) {
        caret.remove();
        output.classList.add('error');
        body.textContent = '生成失败：' + e.message;
      }
      streaming = false;
      genBtns.forEach(b => b.disabled = false);
      modeBtns.forEach(b => b.disabled = false);
      topicBtn.disabled = false;
    });
  });

  /* ---------- 重置 ---------- */
  resetBtn.addEventListener('click', async () => {
    if (!confirm('确定清空所有样本和风格画像吗？')) return;
    const d = await fetch('/api/reset', { method: 'DELETE' }).then(r => r.json());
    alert(d.message);
    preview.classList.remove('show');
    refresh();
  });

  /* ---------- 工具 ---------- */
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  refresh();
})();
</script>
</body>
</html>
